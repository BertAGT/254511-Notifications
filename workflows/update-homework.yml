name: 作业自动发布机器人

on:
  issues:
    types: [opened]

jobs:
  publish:
    # 只处理带 homework 标签的 issue（即"每周作业更新"表单）
    if: contains(github.event.issue.labels.*.name, 'homework')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许改仓库文件
      issues: write     # 允许评论和关闭 issue

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 解析表单并更新网页
        run: python scripts/update_homework.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: 提交并发布
        run: |
          git config user.name "homework-bot"
          git config user.email "actions@github.com"
          git add homework.md index.md
          git commit -m "📦 自动发布：${{ github.event.issue.title }}" || echo "没有改动"
          git push

      - name: 回复并关闭工单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SITE_URL: https://bertagt.github.io/254511-Notifications/homework.html
        run: |
          gh issue comment "$ISSUE_URL" --body "✅ 作业已自动发布！约 1 分钟后可查看：$SITE_URL"
          gh issue close "$ISSUE_URL"
