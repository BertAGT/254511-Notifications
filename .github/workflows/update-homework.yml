name: 作业自动发布机器人

on:
  issues:
    types: [opened]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'homework')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 解析表单并更新网页
        run: python scripts/update_homework.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: 提交并发布
        run: |
          git config user.name "homework-bot"
          git config user.email "actions@github.com"
          git add homework.md index.md archive data
          git commit -m "📦 自动发布：${{ github.event.issue.title }}" || echo "没有改动"
          git push

      - name: 生成静态站
        run: |
          pip install --quiet markdown
          set +e
          python scripts/build_preview.py --site 2>&1 | tee /tmp/build.log
          BUILD_CODE=$?
          set -e
          {
            echo "### 构建输出"
            echo '```'
            cat /tmp/build.log
            echo '```'
            echo "### 工作目录 $(pwd)"
            echo '```'
            ls -la
            echo '```'
            echo "### _site 内容"
            echo '```'
            ls -laR _site 2>&1 | head -40 || echo "NOT FOUND"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $BUILD_CODE

      - name: 检查产物
        run: |
          echo "工作目录：$(pwd)"
          ls -la _site | head -10

      - name: 部署到 EdgeOne
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set +e
          npx -y edgeone pages deploy "$GITHUB_WORKSPACE/_site" -n 254511 -t "$EDGEONE_API_TOKEN" > /tmp/deploy.log 2>&1
          CODE=$?
          echo "exit=$CODE"
          tail -50 /tmp/deploy.log
          {
            echo "### 部署输出（末 50 行）"
            echo ""
            echo '```'
            tail -50 /tmp/deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: 回复并关闭工单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          SITE_URL: https://bertagt.github.io/254511-Notifications/homework.html
        run: |
          gh issue comment "$ISSUE_URL" --body "✅ 作业已自动发布！约 1 分钟后可查看：$SITE_URL"
          gh issue close "$ISSUE_URL"
