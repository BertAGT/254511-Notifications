<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A5E7A'/%3E%3Cpolyline points='6,34 20,34 26,22 32,44 38,16 44,40 48,34 58,34' fill='none' stroke='%23A8E6CF' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* ============================================================
     北欧极简 × 医工深青薄荷
     设计语言：发丝线代替阴影、纯色代替渐变、轻字重 + 大字距、
     克制的留白。版式结构与品牌配色保持不变。
     ============================================================ */
  :root{
    --teal-900:#0C3341;
    --teal-700:#1A5E7A;
    --teal-500:#2E7D96;
    --mint:#A8E6CF;
    --mint-strong:#4CAF8D;
    --mint-bg:#F0F7F3;
    --ink:#12332C;
    --muted:#5F7D75;
    --card:#FFFFFF;
    --hairline:rgba(26,94,122,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    /* 科技感背景：32px 细网格 + 160px 主网格（蓝图/示波器坐标纸质感） */
    background:
      linear-gradient(rgba(26,94,122,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,94,122,.05) 1px, transparent 1px),
      linear-gradient(rgba(26,94,122,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,94,122,.075) 1px, transparent 1px),
      var(--mint-bg);
    background-size:32px 32px,32px 32px,160px 160px,160px 160px,auto;
    color:var(--ink);
    line-height:1.85;
  }
  /* 极光氛围层：缓慢漂移的薄荷/深青柔光 */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 75% -8%, rgba(168,230,207,.32), transparent 62%),
      radial-gradient(ellipse 50% 40% at 10% 90%, rgba(46,125,150,.12), transparent 60%);
    animation:aurora 26s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    from{transform:translate(0,0) scale(1)}
    to{transform:translate(3%,-2%) scale(1.07)}
  }
  @media (prefers-reduced-motion:reduce){body::before{animation:none}}
  /* 顶部渐变光带：3px 的现代细节 */
  body::after{
    content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:60;
    background:linear-gradient(90deg,var(--teal-700),var(--mint-strong) 55%,var(--mint));
    pointer-events:none;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}

  /* ===== 顶部导航：一条发丝线，无阴影 ===== */
  .navbar{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
  }
  .nav-inner{max-width:880px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;color:var(--teal-900);text-decoration:none;letter-spacing:.8px}
  .brand svg{flex:none}
  .nav-links{margin-left:auto;display:flex;gap:4px}
  .nav-links a{
    text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;
    padding:7px 16px;border-radius:999px;transition:color .15s,background .15s;
    letter-spacing:.3px;
  }
  .nav-links a:hover{color:var(--teal-700);background:rgba(168,230,207,.28)}
  .nav-links a.active{color:#fff;background:var(--teal-700)}

  /* ===== 横幅：保留心电图纸 + ECG 签名元素，去掉装饰光斑 ===== */
  .hero{
    position:relative;overflow:hidden;
    margin-top:28px;border-radius:18px;
    padding:46px 42px 94px;
    background:
      linear-gradient(rgba(168,230,207,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,230,207,.06) 1px, transparent 1px),
      linear-gradient(130deg,var(--teal-900) 0%,var(--teal-700) 55%,#2E7D6E 100%);
    background-size:26px 26px,26px 26px,auto;
    color:#fff;
    box-shadow:0 10px 28px -14px rgba(12,51,65,.38);
  }
  .hero h1{
    margin:0 0 10px;font-size:31px;font-weight:600;letter-spacing:2px;
  }
  .hero .sub{margin:0;font-size:14px;color:var(--mint);font-weight:500;letter-spacing:3px}
  .org-badge{
    display:inline-flex;align-items:center;gap:7px;margin-top:20px;
    padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:500;
    background:rgba(255,255,255,.10);border:1px solid rgba(168,230,207,.45);color:var(--mint);
    letter-spacing:.5px;
  }
  .hero .ecg{position:absolute;left:0;right:0;bottom:-4px;width:100%;height:78px;display:block}
  /* 发光底衬：示波管辉光 */
  .ecg-glow{
    fill:none;stroke:var(--mint);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
    opacity:.16;filter:blur(5px);
  }
  /* 远端导联：静态淡线 */
  .ecg-line.dim{
    stroke:rgba(168,230,207,.20);stroke-width:1.5;filter:none;
    animation:none;stroke-dasharray:none;stroke-dashoffset:0;
  }
  .ecg-line{
    fill:none;stroke:var(--mint);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 4px rgba(168,230,207,.8));
    stroke-dasharray:1600;stroke-dashoffset:1600;
    animation:ecg-run 7s linear infinite;
  }
  @keyframes ecg-run{to{stroke-dashoffset:-1600}}
  @media (prefers-reduced-motion:reduce){.ecg-line{animation:none;stroke-dashoffset:0}}

  /* ===== 正文卡片：发丝线 + 极轻投影，留白舒展 ===== */
  .card{
    background:var(--card);border-radius:16px;
    padding:16px 42px 46px;margin:28px 0 54px;
    border:1px solid var(--hairline);
    box-shadow:0 1px 2px rgba(13,59,71,.04);
  }
  h2{
    display:flex;align-items:center;gap:11px;
    font-size:19px;font-weight:700;color:var(--teal-700);
    letter-spacing:1.2px;
    margin:44px 0 18px;padding:4px 0 4px 16px;
    border-left:3px solid var(--teal-700);
  }
  h3{color:var(--teal-700);margin:26px 0 10px;font-weight:700;letter-spacing:.5px}
  a{color:var(--teal-700);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(168,230,207,.95);transition:background .15s,border-color .15s}
  a:hover{background:rgba(168,230,207,.25);border-bottom-color:var(--teal-700)}
  a.dl-btn{border-bottom:none}

  /* 列表：小圆点更轻 */
  ul,ol{padding-left:8px;list-style:none;margin:14px 0}
  ul li,ol li{position:relative;padding:8px 0 8px 26px}
  ul li::before{
    content:"";position:absolute;left:7px;top:19px;width:6px;height:6px;border-radius:50%;
    background:var(--mint-strong);
  }
  li strong{
    display:inline-block;margin-right:8px;padding:1px 12px;border-radius:999px;
    background:#E2F3EA;color:#14594F;font-size:13px;font-weight:600;
  }

  /* 表格：纯色表头，细边框 */
  table{
    width:100%;border-collapse:separate;border-spacing:0;
    margin:18px 0 8px;font-size:14.5px;
    border:1px solid var(--hairline);border-radius:10px;overflow:hidden;
  }
  thead th{
    background:var(--teal-700);
    color:#fff;font-weight:600;padding:12px 16px;text-align:left;letter-spacing:1px;
  }
  tbody td{padding:12px 16px;border-top:1px solid rgba(26,94,122,.08)}
  tbody tr:nth-child(even){background:#F5FAF7}
  tbody tr:hover{background:rgba(168,230,207,.16)}

  /* 徽章 */
  .deadline{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:#FDECEC;color:#C0392B}
  .done{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:#E2F3EA;color:#14594F}
  .tbd{color:var(--muted);font-size:13px}
  .new-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--mint-strong);color:#fff;margin-left:8px;vertical-align:2px;letter-spacing:.5px}

  /* 提示框：纯色底 */
  .notice,.dl-tip{
    background:#F1F8F4;
    border-left:3px solid var(--mint-strong);
    border-radius:8px;padding:13px 16px;font-size:14px;color:#1B4D42;margin:18px 0;
  }

  /* ===== 通知页专属 ===== */
  .page-notices .content h1{
    display:flex;align-items:center;flex-wrap:wrap;gap:10px;
    font-size:18.5px;font-weight:700;letter-spacing:.8px;line-height:1.55;
    margin:38px 0 0;padding:15px 22px;
    color:#fff;
    background:var(--teal-700);
    border-radius:10px;
  }
  .page-notices .content h1:first-child{margin-top:12px}
  /* **NEW** 标记：薄荷绿徽章（轻呼吸） */
  .page-notices .content h1 strong{
    display:inline-flex;align-items:center;
    font-size:11px;font-weight:700;letter-spacing:1.5px;
    padding:3px 12px;border-radius:999px;
    background:var(--mint);color:var(--teal-900);text-shadow:none;
    animation:new-pulse 2.6s ease-in-out infinite;
  }
  @keyframes new-pulse{
    0%,100%{box-shadow:0 0 0 3px rgba(168,230,207,.25)}
    50%{box-shadow:0 0 0 6px rgba(168,230,207,.10)}
  }
  @media (prefers-reduced-motion:reduce){.page-notices .content h1 strong{animation:none}}
  /* 内容面板：纯色浅绿底 + 薄荷左边条 */
  .page-notices .content ul{
    background:#F7FBF9;
    border-left:3px solid var(--mint-strong);
    border-radius:4px 10px 10px 4px;
    margin:12px 0 6px;padding:10px 24px 14px;
  }
  .page-notices .content > p{
    background:#F7FBF9;
    border-left:3px solid var(--mint-strong);
    border-radius:4px 10px 10px 4px;
    margin:12px 0;padding:10px 20px;
  }
  /* 通知之间的分隔线：北欧式短实线 */
  .page-notices .content hr{
    border:none;height:2px;width:48px;margin:40px auto;
    background:rgba(76,175,141,.45);
    border-radius:2px;
  }
  /* 附件链接 → 虚线边框文件芯片 */
  .page-notices a[href$=".pdf"],.page-notices a[href$=".zip"],
  .page-notices a[href$=".doc"],.page-notices a[href$=".docx"],
  .page-notices a[href$=".xlsx"]{
    display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:1px dashed var(--mint-strong);border-radius:8px;
    padding:7px 14px;margin:4px 8px 4px 0;font-size:13.5px;font-weight:600;
    color:var(--teal-700);text-decoration:none;border-bottom:1px dashed var(--mint-strong);
    transition:background .15s,border-color .15s;
  }
  .page-notices a[href$=".pdf"]:hover,.page-notices a[href$=".zip"]:hover,
  .page-notices a[href$=".doc"]:hover,.page-notices a[href$=".docx"]:hover,
  .page-notices a[href$=".xlsx"]:hover{
    background:var(--mint-bg);
  }
  .page-notices a[href$=".pdf"]::before,.page-notices a[href$=".zip"]::before,
  .page-notices a[href$=".doc"]::before,.page-notices a[href$=".docx"]::before,
  .page-notices a[href$=".xlsx"]::before{content:"📎"}

  /* ===== 作业页专属：周标题卡 + 科目列强调 ===== */
  .page-homework .content h1{
    display:flex;align-items:center;gap:10px;
    font-size:20px;font-weight:700;letter-spacing:1px;
    margin:12px 0 6px;padding:15px 22px;
    color:#fff;
    background:var(--teal-700);
    border-radius:10px;
  }
  /* 科目列：加粗 + 深青色，扫一眼就能定位课程 */
  .page-homework .content td:first-child{font-weight:600;color:var(--teal-700);white-space:nowrap}

  /* ===== 首页专属：日期胶囊 + 查看按钮 ===== */
  .page-home .content li strong{
    display:inline-block;margin-right:10px;padding:2px 13px;border-radius:999px;
    background:var(--teal-700);
    color:#fff;font-size:13px;font-weight:600;letter-spacing:.5px;
  }
  .page-home .content li a{
    display:inline-flex;align-items:center;gap:5px;
    background:#fff;border:1px solid rgba(26,94,122,.22);border-radius:999px;
    padding:2px 15px;font-size:13px;font-weight:600;color:var(--teal-700);
    border-bottom:1px solid rgba(26,94,122,.22);
    transition:all .15s;margin-left:4px;
  }
  .page-home .content li a::after{content:"→";transition:transform .15s}
  .page-home .content li a:hover{
    background:var(--teal-700);border-color:var(--teal-700);color:#fff;
  }
  .page-home .content li a:hover::after{transform:translateX(2px)}

  /* ===== 打印模式：打印/导出PDF时只留干净内容 ===== */
  @media print{
    .navbar,.hero,footer,.ecg{display:none!important}
    body{background:#fff}
    body::before{display:none}
    body::after{display:none}
    .card{
      box-shadow:none;border:none;padding:0;margin:0;
      border-radius:0;max-width:100%;
    }
    .wrap{max-width:100%;padding:0}
    table{border-color:#999}
    .page-notices .content h1,.page-homework .content h1{
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .dl-btn{display:none}
    a{color:#1A5E7A;border-bottom:1px solid #999}
  }

  /* 图片自适应：发丝边框，无阴影 */
  .content img{
    max-width:100%;
    height:auto;
    border-radius:10px;
    border:1px solid var(--hairline);
    margin:6px 0;
  }

  /* 下载按钮：纯色深青，悬浮加深 */
  .dl-btn{
    display:inline-flex;align-items:center;gap:9px;
    background:var(--teal-700);
    color:#fff;font-size:15px;font-weight:600;
    padding:13px 26px;border-radius:999px;margin:8px 12px 8px 0;
    letter-spacing:.5px;
    box-shadow:0 1px 2px rgba(13,59,71,.10);
    transition:background .15s;
  }
  .dl-btn:hover{
    background:var(--teal-900);
  }

  footer{
    text-align:center;padding:28px 0 44px;color:var(--muted);font-size:13px;
    letter-spacing:.5px;
  }
  footer .f-ecg{display:block;margin:0 auto 10px}

  @media (max-width:640px){
    .hero{padding:32px 24px 80px}
    .hero h1{font-size:24px}
    .card{padding:8px 20px 32px}
    table{font-size:13px}
    thead th,tbody td{padding:9px 10px}
    .nav-inner{gap:8px}
    .nav-links a{padding:6px 11px;font-size:13px}
  }
</style>
</head>
<body class="page-{{ page.nav | default: 'home' }}">

<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg width="30" height="30" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1A5E7A"/><polyline points="6,34 20,34 26,22 32,44 38,16 44,40 48,34 58,34" fill="none" stroke="#A8E6CF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      {{ site.title }}
    </a>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}" {% if page.nav == "home" %}class="active"{% endif %}>🏠 首页</a>
      <a href="{{ 'homework.html' | relative_url }}" {% if page.nav == "homework" %}class="active"{% endif %}>📚 每周作业</a>
      <a href="{{ 'notices.html' | relative_url }}" {% if page.nav == "notices" %}class="active"{% endif %}>📢 学习通知</a>
    </div>
  </div>
</nav>

{% if page.show_banner %}
<header class="hero wrap">
  <h1>📘 {{ site.title }}</h1>
  <p class="sub">每周作业 · 学习通知 · 一站直达</p>
  <span class="org-badge">🚀 北京航空航天大学 · 医学科学与工程学院</span>
  <svg class="ecg" viewBox="0 0 900 78" preserveAspectRatio="none" aria-hidden="true">
    <!-- 远端导联（静态淡线，纵深感） -->
    <polyline class="ecg-line dim" points="0,26 180,26 188,21 196,26 230,26 240,15 246,39 252,0 258,33 264,26 300,26 310,19 322,26 500,26 508,21 516,26 550,26 560,15 566,39 572,0 578,33 584,26 620,26 630,19 642,26 900,26"/>
    <!-- 发光底衬 -->
    <polyline class="ecg-glow" points="0,52 180,52 190,45 200,52 240,52 250,46 256,50 262,70 268,26 274,62 280,52 320,52 332,43 346,52 500,52 510,45 520,52 560,52 570,46 576,50 582,70 588,26 594,62 600,52 640,52 652,43 666,52 900,52"/>
    <!-- 主导联：带 P 波-QRS-T 波的完整心动周期 -->
    <polyline class="ecg-line" points="0,52 180,52 190,45 200,52 240,52 250,46 256,50 262,70 268,26 274,62 280,52 320,52 332,43 346,52 500,52 510,45 520,52 560,52 570,46 576,50 582,70 588,26 594,62 600,52 640,52 652,43 666,52 900,52"/>
  </svg>
</header>
{% endif %}

<main class="wrap">
  <div class="card content">
    {{ content }}
  </div>
</main>

<footer>
  <svg class="f-ecg" width="120" height="16" viewBox="0 0 120 16" aria-hidden="true"><polyline points="0,8 44,8 50,2 56,13 62,1 68,12 72,8 120,8" fill="none" stroke="#A8E6CF" stroke-width="2" stroke-linecap="round"/></svg>
  北京航空航天大学 · 医学科学与工程学院 · 254511班<br>
  <span style="font-size:12px;opacity:.75">由侯宝琪维护 · Powered by GitHub Pages</span>
</footer>

</body>
</html>
